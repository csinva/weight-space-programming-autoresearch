[project]
name = "interpretable-weight-space-programming"
version = "0.1.0"
description = "Agents that write interpretable models by hand, with no training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.8.3",
    "h5py>=3.10.0",
    "joblib>=1.3.0",
    "matplotlib>=3.10.0",
    "nibabel>=5.0.0",
    "nltk>=3.9.4",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "spacy>=3.8.11",
    "torch>=2.10.0",
    "tqdm>=4.66.0",
    "transformers>=5.3.0",
    "xarray>=2024.1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=7"]
dashboard = ["starlette>=0.37", "uvicorn>=0.30"]
baselines = ["kymatio>=0.3", "plenoptic>=1.1"]
