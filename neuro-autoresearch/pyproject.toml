[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-autoresearch"
version = "0.1.0"
description = "Dataset-agnostic neural-encoding framework on top of NeuralSet/NeuralFetch."
requires-python = ">=3.12"
dependencies = [
    "neuralset[all]>=0.2.2",
    "neuralfetch>=0.2.2",
    "torch>=2.5",
    "copilot-keepgoing @ git+https://github.com/csinva/copilot-keepgoing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
dashboard = ["starlette>=0.37", "uvicorn>=0.30"]

[tool.setuptools]
py-modules = []
