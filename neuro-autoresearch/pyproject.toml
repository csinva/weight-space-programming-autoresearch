[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-autoresearch"
version = "0.3.1"
description = "RSA-driven neural representation search with held-out encoding evaluation."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pillow>=10",
    "nibabel>=5",
    "xarray>=2024.1",
    "pandas>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
dashboard = ["starlette>=0.37", "uvicorn>=0.30"]

[tool.setuptools]
py-modules = ["final_eval"]

[tool.setuptools.packages.find]
include = ["neuro_eval", "neuro_eval.*", "search", "search.*", "dashboard", "dashboard.*"]
namespaces = true

[tool.setuptools.package-data]
search = ["config.env", "pricing.json", "prompts/*.md"]
dashboard = ["static/index.html", "static/assets/*"]
